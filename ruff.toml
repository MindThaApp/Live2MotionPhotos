# Minimal lint config: real errors only (pyflakes + syntax/runtime), no style churn.
target-version = "py312"
extend-exclude = ["bundle", "docs"]

[lint]
select = ["E4", "E7", "E9", "F"]
# Style-only findings in the vendored MotionPhoto2 code and the tests are left alone
ignore = ["E701", "E702", "E722", "E741"]

[lint.per-file-ignores]
"app.py" = ["E402"]   # imports after the sys.path tweak for MotionPhoto2/
